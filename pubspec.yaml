name: torch_mobile
description: "boilerplate project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.5.0
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/logos/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt/Prompt-Bold.ttf
        - asset: assets/fonts/Prompt/Prompt-Medium.ttf
        - asset: assets/fonts/Prompt/Prompt-Regular.ttf
