name: torch_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  i18n: ^4.2.5
  http: ^1.5.0
  get_it: ^8.2.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/logos/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt/Prompt-Bold.ttf
        - asset: assets/fonts/Prompt/Prompt-Medium.ttf
        - asset: assets/fonts/Prompt/Prompt-Regular.ttf
